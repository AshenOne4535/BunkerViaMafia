version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bunker_postgres_db
    restart: always
    environment:
      POSTGRES_USER: bunker_admin
      POSTGRES_PASSWORD: bunker_password123
      POSTGRES_DB: bunker_game_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: